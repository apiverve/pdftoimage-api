openapi: 3.0.4
info:
  title: PDF to Image
  description: >-
    PDF to Image renders the pages you choose from a PDF, uploaded or fetched
    from a URL, as PNG or JPG images and returns a download link for each, valid
    for 2 days, with its pixel size. The Free plan renders one page per call at
    150 dpi; paid plans render up to 10 pages per call and can set the
    resolution from 72 to 300 dpi.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/pdftoimage:
    post:
      summary: PDF to Image
      description: Render pages of an uploaded PDF, or a PDF URL, as PNG or JPG images
      operationId: pdftoimage
      parameters:
        - name: pages
          in: query
          schema:
            type: string
          required: false
          description: >-
            Pages to render, as numbers and ranges such as 1-3,5; at most 10 per
            call on paid plans, 1 on the Free plan
          example: '1'
        - name: format
          in: query
          schema:
            type: string
          required: false
          description: Image format
          example: png
        - name: quality
          in: query
          schema:
            type: integer
          required: false
          description: JPG quality from 1 to 100; ignored for PNG
          example: 90
        - name: dpi
          in: query
          schema:
            type: integer
          required: false
          description: Resolution in dots per inch, from 72 to 300
          example: 150
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  pageCount: 14
                  format: png
                  dpi: 150
                  imageCount: 2
                  expires: 1792400000000
                  images:
                    - page: 1
                      imageName: 3b7e9d21-4c5a-4f80-a1d6-9e2c8b7f5a34-1.png
                      width: 1275
                      height: 1650
                      dpi: 150
                      size: 214533
                      downloadURL: https://storage.googleapis.com/apiverve/APIData/pdftoimage/3b7e9d21-4c5a-4f80-a1d6-9e2c8b7f5a34-1.png?GoogleAccessId=635500398038-compute%40developer.gserviceaccount.com&Expires=1792400000&Signature=SAMPLE
                    - page: 2
                      imageName: 3b7e9d21-4c5a-4f80-a1d6-9e2c8b7f5a34-2.png
                      width: 1275
                      height: 1650
                      dpi: 150
                      size: 198207
                      downloadURL: https://storage.googleapis.com/apiverve/APIData/pdftoimage/3b7e9d21-4c5a-4f80-a1d6-9e2c8b7f5a34-2.png?GoogleAccessId=635500398038-compute%40developer.gserviceaccount.com&Expires=1792400000&Signature=SAMPLE
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                pdf:
                  type: string
                  format: binary
                  description: 'File to upload (accepted: .pdf, max 10MB)'
                  x-acceptedTypes:
                    - .pdf
                  x-maxSizeMB: 10
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
sampleRequest:
  pdf: https://raw.githubusercontent.com/mozilla/pdf.js/master/web/compressed.tracemonkey-pldi-09.pdf
  pages: 1-2
  format: png
